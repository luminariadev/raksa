name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go-test-and-vet:
    name: Go Format, Vet, Race Tests & Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Verify gofmt formatting
        run: |
          unformatted=$(gofmt -l cmd internal playbooks)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests with race detector
        run: go test -race -count=1 ./...

      - name: Run Go vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Verify CLI Hybrid aggregation, SARIF/HTML, and Web UI smoke gates
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/raksa ./cmd/raksa
          /tmp/raksa version
          /tmp/raksa doctor --format json > /dev/null
          /tmp/raksa attack-matrix --format json > /dev/null
          /tmp/raksa playbooks list --format json > /dev/null
          /tmp/raksa install --dry-run --layers netguard,pipeguard --format json > /dev/null
          /tmp/raksa scan --from-reports testdata/clean.json --format json --fail-on low --no-history
          set +e
          /tmp/raksa scan --from-reports testdata --format sarif --fail-on high --no-history > /tmp/suite.sarif
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "Expected exit code 2 from mixed fixture breach, got $rc"
            exit 1
          fi
          grep -q '"version": "2.1.0"' /tmp/suite.sarif
          /tmp/raksa scan --from-reports testdata --format html --fail-on none --no-history > /tmp/suite.html
          grep -q 'Raksa Flagship Suite Report' /tmp/suite.html

          /tmp/raksa ui --listen 127.0.0.1:18787 --from-reports testdata --no-auth --no-open > /tmp/ui.log 2>&1 &
          UI_PID=$!
          trap 'kill "$UI_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:18787/healthz > /dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          curl -fsSI http://localhost:18787/ | grep -qi "Content-Security-Policy"
          curl -fsS http://localhost:18787/api/v1/mcp-catalog | grep -q '"total":61'

  docker-smoke:
    name: Distroless Container Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build distroless image
        run: docker build -t raksa:ci .

      - name: Verify non-root execution inside container
        run: |
          docker run --rm raksa:ci version
          docker run --rm raksa:ci attack-matrix --format json > /dev/null
          docker run --rm raksa:ci playbooks list --format json > /dev/null
