name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Resolve and Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Validate tag format
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: invalid semver release tag '$TAG' (expected vX.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: arm64
            ext: ".exe"
            archive: zip

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Run go vet and tests
        run: |
          go vet ./...
          go test ./...

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X github.com/luminariadev/raksa/internal/schema.Version=${VERSION} -X github.com/luminariadev/raksa/internal/schema.Commit=${GITHUB_SHA} -X github.com/luminariadev/raksa/internal/schema.BuildDate=${BUILD_DATE}" \
            -o "dist/raksa${{ matrix.ext }}" \
            ./cmd/raksa

      - name: Package release archive
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          PKG_NAME="raksa-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "release/${PKG_NAME}"
          cp "dist/raksa${{ matrix.ext }}" README.md LICENSE "release/${PKG_NAME}/"
          mkdir -p artifacts
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd release && zip -r "../artifacts/${PKG_NAME}.zip" "${PKG_NAME}")
          else
            tar -czf "artifacts/${PKG_NAME}.tar.gz" -C release "${PKG_NAME}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: raksa-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: downloaded

      - name: Collect release artifacts and SHA256SUMS.txt
        run: |
          mkdir -p release-files
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-files/ \;
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          ls -lh release-files

      - name: Publish Release with Assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          cd release-files
          for attempt in 1 2 3 4; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              if gh release upload "$TAG_NAME" * --clobber; then
                exit 0
              fi
            else
              if gh release create "$TAG_NAME" * --title "raksa $TAG_NAME" --generate-notes; then
                exit 0
              fi
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to publish GitHub Release after retries" >&2
          exit 1
